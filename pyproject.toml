[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "malferma-libro"
dynamic = ["version"]
description = "A GTK e-book reader with a local library and OPDS catalogs"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Malferma Libro contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = ["markdown-it-py>=3.0.0", "PyGObject>=3.42"]

[project.scripts]
malferma-libro = "malferma_libro.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "malferma_libro.__version__"}

[tool.setuptools.package-data]
malferma_libro = ["assets/**/*", "locale/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "*~", ".env", ".env.*", "*/.env", "*/.env.*", ".DS_Store", "*/.DS_Store"]
