name: Capture screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Install native Debian 13 capture dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-gi python3-cairo \
            python3-markdown-it gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-pango-1.0 \
            gir1.2-gdkpixbuf-2.0 librsvg2-common xvfb xauth dbus-x11 imagemagick fonts-noto-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture actual application windows
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          GTK_A11Y: none
          PYTHONPATH: src
        run: xvfb-run -a --server-args='-screen 0 1920x1200x24' dbus-run-session -- /usr/bin/python3 -B packaging/screenshots.py --output docs/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: malferma-libro-screenshots
          path: docs/screenshots/
          if-no-files-found: error
