name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the checked build as a development prerelease
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-markdown-it python3-setuptools python3-wheel dpkg-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-pango-1.0 gir1.2-gdkpixbuf-2.0 \
            librsvg2-common poppler-utils djvulibre-bin xvfb dbus-x11 desktop-file-utils
      - name: Check source and translations
        run: make check
      - name: Check desktop launcher
        run: desktop-file-validate data/applications/*.desktop
      - name: Exercise native GTK widgets under Xvfb
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session -- make gui-test
      - name: Check illustration layout at 200 percent scale
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GDK_SCALE: 2
          PYTHONPATH: src
        run: xvfb-run -a --server-args='-screen 0 2560x2048x24' dbus-run-session -- /usr/bin/python3 -B packaging/check_gui.py --pattern test_gui_illustrations.py
      - name: Build current release files
        run: make release
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: malferma-libro-current
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: malferma-libro-current
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(/usr/bin/python3 -c 'import runpy; build = runpy.run_path("packaging/build.py"); print(build["package_version"]())')
          gh release create "v$version" \
            "dist/malferma-libro_${version}_all.deb" \
            "dist/malferma-libro_${version}_source.zip" \
            "dist/malferma-libro_${version}_source.tar.gz" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Malferma Libro $version (development prerelease)" \
            --notes-file packaging/release-notes.md \
            --prerelease --latest=false
