name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the checked build
        type: boolean
        required: false
        default: false
      release_channel:
        description: Use release only after the manual desktop checks pass
        type: choice
        options:
          - prerelease
          - release
        required: true
        default: prerelease

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution dependencies
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends python3 python3-gi python3-markdown-it python3-setuptools python3-wheel dpkg-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-pango-1.0 gir1.2-gdkpixbuf-2.0 \
            librsvg2-common poppler-utils djvulibre-bin xvfb dbus-x11 desktop-file-utils
      - name: Check source and translations
        run: make check
      - name: Check desktop launcher
        run: desktop-file-validate data/applications/*.desktop
      - name: Exercise native GTK widgets under Xvfb
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session -- make gui-test
      - name: Check illustration layout at 200 percent scale
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GDK_SCALE: 2
          PYTHONPATH: src
        run: xvfb-run -a --server-args='-screen 0 2560x2048x24' dbus-run-session -- /usr/bin/python3 -B packaging/check_gui.py --pattern test_gui_illustrations.py
      - name: Build current release files
        run: make release
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: malferma-libro-current
          path: dist/*
          if-no-files-found: error

  debian:
    name: Install and upgrade on Debian 13
    needs: linux
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3 \
            xvfb xauth dbus-x11 desktop-file-utils man-db adwaita-icon-theme
          useradd --create-home reader-test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: malferma-libro-current
          path: /tmp/malferma-release-artifacts
      - name: Verify candidate and fresh installation
        run: |
          set -eu
          cd /tmp/malferma-release-artifacts
          sha256sum --check --strict SHA256SUMS
          set -- ./*.deb
          test "$#" -eq 1
          candidate_version=$(dpkg-deb -f "$1" Version)
          dpkg --compare-versions "$candidate_version" gt 0.1.1-3
          apt-get install -y --no-install-recommends "$1"
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" check \
            --package-version "$candidate_version"
      - name: Upgrade from the published package with an existing library
        run: |
          set -eu
          curl --fail --location --retry 3 \
            --output /tmp/malferma-libro-baseline.deb \
            https://github.com/gagafes/malferma-libro/releases/download/v0.1.1-3/malferma-libro_0.1.1-3_all.deb
          printf '%s  %s\n' \
            fff7a03912353b2f3313061181af7db780f2ea746a29480d9ba119143179241f \
            /tmp/malferma-libro-baseline.deb | sha256sum --check --strict
          apt-get purge -y malferma-libro
          apt-get install -y --no-install-recommends /tmp/malferma-libro-baseline.deb
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" check \
            --package-version 0.1.1-3
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" seed \
            --profile /tmp/malferma-upgrade-profile
          cd /tmp/malferma-release-artifacts
          set -- ./*.deb
          test "$#" -eq 1
          candidate_version=$(dpkg-deb -f "$1" Version)
          apt-get install -y --no-install-recommends "$1"
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" check \
            --package-version "$candidate_version"
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" verify \
            --profile /tmp/malferma-upgrade-profile
      - name: Exercise installed GTK widgets on Debian 13
        run: |
          runuser -u reader-test -- env \
            PYTHONPATH=/usr/share/malferma-libro \
            GSK_RENDERER=cairo GDK_BACKEND=x11 GTK_A11Y=none \
            xvfb-run -a --server-args='-screen 0 1920x1200x24' dbus-run-session -- \
            /usr/bin/python3 -B packaging/check_gui.py
      - name: Exercise installed illustrations at 200 percent scale
        run: |
          runuser -u reader-test -- env \
            PYTHONPATH=/usr/share/malferma-libro \
            GSK_RENDERER=cairo GDK_BACKEND=x11 GTK_A11Y=none GDK_SCALE=2 \
            xvfb-run -a --server-args='-screen 0 2560x2048x24' dbus-run-session -- \
            /usr/bin/python3 -B packaging/check_gui.py --pattern test_gui_illustrations.py

  ubuntu:
    name: Install and upgrade on Ubuntu 24.04 (${{ matrix.scenario }})
    needs: linux
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade]
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8

    steps:
      - name: Verify clean Ubuntu environment and install test tools
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          cat /etc/os-release
          dpkg --print-architecture
          test "$(dpkg --print-architecture)" = amd64
          # The minimal Ubuntu image excludes documentation and man pages.
          # Retain the full installed payload so dpkg verification and man work.
          if [ -f /etc/dpkg/dpkg.cfg.d/excludes ]; then
            cat /etc/dpkg/dpkg.cfg.d/excludes
            mv /etc/dpkg/dpkg.cfg.d/excludes /tmp/ubuntu-container-dpkg-excludes
          fi
          test "$(dpkg-query -W -f='${Status}' malferma-libro 2>/dev/null || true)" != "install ok installed"
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends git ca-certificates curl python3 \
            xvfb xauth dbus-x11 desktop-file-utils man-db adwaita-icon-theme
          # Match Ubuntu's unminimize handling of the placeholder man command.
          dpkg-divert --list /usr/bin/man
          if [ "$(dpkg-divert --truename /usr/bin/man)" = /usr/bin/man.REAL ]; then
            test -x /usr/bin/man.REAL
            mv /usr/bin/man /tmp/ubuntu-container-man-stub
            dpkg-divert --quiet --remove --rename /usr/bin/man
          fi
          man --version
          useradd --create-home reader-test

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: malferma-libro-current
          path: /tmp/malferma-release-artifacts

      - name: Verify the candidate from this workflow run
        run: |
          set -euo pipefail
          cd /tmp/malferma-release-artifacts
          sha256sum --check --strict SHA256SUMS
          set -- ./*.deb
          test "$#" -eq 1
          test "$(dpkg-deb -f "$1" Package)" = malferma-libro
          test "$(dpkg-deb -f "$1" Architecture)" = all
          candidate_version=$(dpkg-deb -f "$1" Version)
          [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]]
          dpkg --compare-versions "$candidate_version" gt 0.1.1-3
          cp -- "$1" /tmp/malferma-candidate.deb
          printf 'CANDIDATE_VERSION=%s\n' "$candidate_version" >> "$GITHUB_ENV"

      - name: Install published 0.1.1-3 and seed an isolated test library
        if: matrix.scenario == 'upgrade'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            --output /tmp/malferma-libro_0.1.1-3_all.deb \
            https://github.com/gagafes/malferma-libro/releases/download/v0.1.1-3/malferma-libro_0.1.1-3_all.deb
          printf '%s  %s\n' \
            fff7a03912353b2f3313061181af7db780f2ea746a29480d9ba119143179241f \
            /tmp/malferma-libro_0.1.1-3_all.deb | sha256sum --check --strict
          test "$(dpkg-deb -f /tmp/malferma-libro_0.1.1-3_all.deb Version)" = 0.1.1-3
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends /tmp/malferma-libro_0.1.1-3_all.deb
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" check --package-version 0.1.1-3
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" seed --profile /tmp/malferma-ubuntu-upgrade-profile

      - name: Install the candidate through APT and verify the installed package
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends /tmp/malferma-candidate.deb
          apt-get check
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" check --package-version "$CANDIDATE_VERSION"
          dpkg-query -W -f='${Package} ${Version}\n' \
            malferma-libro python3 python3-gi python3-markdown-it \
            gir1.2-gtk-4.0 gir1.2-adw-1 librsvg2-common poppler-utils djvulibre-bin

      - name: Verify all seeded library data after the upgrade
        if: matrix.scenario == 'upgrade'
        run: |
          set -euo pipefail
          runuser -u reader-test -- /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/packaging/check_installed.py" verify --profile /tmp/malferma-ubuntu-upgrade-profile

      - name: Exercise installed GTK widgets at normal scale
        run: |
          set -euo pipefail
          cd /tmp
          runuser -u reader-test -- env \
            PYTHONPATH=/usr/share/malferma-libro \
            GSK_RENDERER=cairo GDK_BACKEND=x11 GTK_A11Y=none \
            xvfb-run -a --server-args='-screen 0 1920x1200x24' dbus-run-session -- \
            /usr/bin/python3 -B "$GITHUB_WORKSPACE/packaging/check_gui.py"

      - name: Exercise installed illustrations at 200 percent scale
        run: |
          set -euo pipefail
          cd /tmp
          runuser -u reader-test -- env \
            PYTHONPATH=/usr/share/malferma-libro \
            GSK_RENDERER=cairo GDK_BACKEND=x11 GTK_A11Y=none GDK_SCALE=2 \
            xvfb-run -a --server-args='-screen 0 2560x2048x24' dbus-run-session -- \
            /usr/bin/python3 -B "$GITHUB_WORKSPACE/packaging/check_gui.py" --pattern test_gui_illustrations.py

      - name: Inspect installed files and dpkg filters after a failure
        if: failure()
        run: |
          dpkg --audit
          dpkg --verify malferma-libro || true
          grep -R -nE 'path-(exclude|include)' /etc/dpkg/dpkg.cfg /etc/dpkg/dpkg.cfg.d/ || true

      - name: Record successful validation scope
        env:
          TEST_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          {
            printf '## Ubuntu 24.04: %s passed\n\n' "$TEST_SCENARIO"
            printf '%s\n' \
              '- Candidate DEB verified against SHA256SUMS from this workflow run.' \
              '- Installed CLI, manuals, desktop resources, dependencies and test library passed.' \
              '- Installed native GTK and 200% illustration tests passed under Xvfb.'
            if [ "$TEST_SCENARIO" = upgrade ]; then
              printf '%s\n' '- Upgrade from published 0.1.1-3 preserved book bytes, reading position, bookmarks, notes, settings and catalog configuration.'
            fi
            printf '\n%s\n' 'Scope: Ubuntu 24.04 amd64 container, automated X11 virtual display. Live desktop, audio output, screen reader and network OPDS interaction were not tested.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [linux, debian, ubuntu]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    concurrency:
      group: github-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: malferma-libro-current
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish checked release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -B packaging/release_guard.py
          version=$(/usr/bin/python3 -c 'import runpy; build = runpy.run_path("packaging/build.py"); print(build["package_version"]())')
          case "$RELEASE_CHANNEL" in
            release)
              release_title="Malferma Libro $version"
              release_flags=(--latest)
              ;;
            prerelease)
              release_title="Malferma Libro $version (development prerelease)"
              release_flags=(--prerelease --latest=false)
              ;;
            *)
              printf '%s\n' 'Unknown release channel' >&2
              exit 1
              ;;
          esac
          gh release create "v$version" \
            "dist/malferma-libro_${version}_all.deb" \
            "dist/malferma-libro_${version}_source.zip" \
            "dist/malferma-libro_${version}_source.tar.gz" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes-file packaging/release-notes.md \
            "${release_flags[@]}"
