# Continuous checks for changes, manual dispatch, and weekly vulnerability refresh.
name: Python quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: python-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-analysis:
    name: Ruff, Bandit and Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/python-quality.yml
      - name: Install analysis tools
        run: python -m pip install 'ruff>=0.15,<1' 'bandit>=1.8,<2' 'semgrep>=1.140,<2'
      - name: Ruff (syntax and correctness rules)
        run: ruff check --select E9,F src packaging tests
      - name: Bandit (medium/high confidence and severity)
        run: bandit -r src/malferma_libro packaging -ll -ii
      - name: Semgrep (error-severity security rules)
        if: ${{ !cancelled() }}
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --config p/python --config p/security-audit --severity ERROR --error --metrics=off src/malferma_libro packaging

  dependencies:
    name: pip-audit (declared PyPI requirements)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/python-quality.yml
      - name: Install pip-audit
        run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Derive pip-managed dependencies from pyproject.toml
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          requirements = metadata["project"]["dependencies"]
          # PyGObject on supported Debian/Ubuntu is supplied by python3-gi,
          # rather than pip (which needs system GObject development headers).
          def name(spec):
              return re.split(r"[\s\[<>=!~;]", spec, maxsplit=1)[0].replace("_", "-").lower()
          assert "pygobject" in {name(spec) for spec in requirements}, "Review the distro-managed exception"
          pypi = [spec for spec in requirements if name(spec) != "pygobject"]
          assert pypi, "No PyPI requirements to audit; review scope explicitly"
          path = pathlib.Path("/tmp/malferma-pypi-requirements.txt")
          path.write_text("\n".join(pypi) + "\n", encoding="utf-8")
          print(path.read_text())
          PY
      - name: Audit resolved PyPI dependency graph
        run: |
          pip-audit -r /tmp/malferma-pypi-requirements.txt
          echo 'PyGObject is installed through APT; pip-audit does not assess distro-managed packages.' >> "$GITHUB_STEP_SUMMARY"

  pytest:
    name: pytest (unit regressions)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install distro-native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-gi python3-markdown-it python3-defusedxml \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-pango-1.0 gir1.2-gdkpixbuf-2.0 \
            librsvg2-common poppler-utils djvulibre-bin xvfb dbus-x11
      - name: Run existing unittest suites through pytest
        env:
          PYTHONPATH: src
        run: /usr/bin/python3 -m pytest -q tests
